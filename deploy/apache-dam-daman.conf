# Dam-Daman: tambahan untuk VirtualHost *:443 dam.punyasurya.com
# Dipasang lewat baris "Include /etc/apache2/dam-daman.conf" di dalam
# dam.punyasurya.com-le-ssl.conf (lihat docs/DEPLOY.md).
# Butuh modul: proxy proxy_http proxy_wstunnel rewrite headers

ProxyPreserveHost On
ProxyRequests Off

# WebSocket untuk room online (Socket.IO)
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:3747/socket.io/$1 [P,L]
ProxyPass        /socket.io/ http://127.0.0.1:3747/socket.io/
ProxyPassReverse /socket.io/ http://127.0.0.1:3747/socket.io/

# Cek kesehatan server game
ProxyPass        /api/ http://127.0.0.1:3747/api/
ProxyPassReverse /api/ http://127.0.0.1:3747/api/

# Link undangan /r/KODE dilayani oleh index.html
FallbackResource /index.html

<IfModule mod_headers.c>
  <LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </LocationMatch>
  <LocationMatch "^/(index\.html)?$">
    Header set Cache-Control "no-cache"
  </LocationMatch>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
